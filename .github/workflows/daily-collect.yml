name: Daily temple data collection

on:
  # schedule disabled on debug branch
  x-schedule:
    # 18:47 UTC = 00:17 AM IST. GitHub usually starts scheduled jobs 2–3 hours late,
    # so the real run lands around 02:00–03:30 AM IST — the low-traffic night window.
    - cron: "47 18 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget in minutes (max 55)"
        default: "50"
      states:
        description: "Comma list e.g. IN-TN,IN-KL, SII (inscriptions), GOV (data.gov.in) — blank = all"
        default: ""

permissions:
  contents: write

concurrency:
  group: temple-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # hard stop at 1 hour
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dump sample SII pages (debug branch only)
        run: python debug/dump.py
      - name: Commit debug
        run: |
          git config user.name "temple-bot"; git config user.email "temple-bot@users.noreply.github.com"
          git add debug/ && git commit -m "debug dump" && git push origin HEAD:sii-debug
      - uses: actions/upload-artifact@v4
        with:
          name: south_india_temples_${{ github.run_number }}
          path: output/south_india_temples.xlsx
          retention-days: 14
